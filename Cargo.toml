[package]
name = "bticino-easykit"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Unofficial Linux/Windows client for the BTicino EASYKIT WiFi video door entry kit (Netatmo cloud)"
license = "MIT"
repository = "https://github.com/deddroid/bticino-easykit"
readme = "README.md"
keywords = ["bticino", "netatmo", "intercom", "doorbell", "easykit"]
categories = ["command-line-utilities"]

[lib]
name = "bticino_easykit"
path = "src/lib.rs"

[[bin]]
name = "bticino-easykit"
path = "src/bin/cli.rs"

[[bin]]
name = "bticino-easykit-gui"
path = "src/bin/gui/main.rs"
required-features = ["gui"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.16", optional = true }
dirs = "5"
eframe = { version = "0.37", optional = true }
env_logger = "0.11"
fcm_receiver_rs = "0.1.1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
log = "0.4"
notify-rust = { version = "4", optional = true }
openh264 = { version = "0.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
rtc = { version = "0.21.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "0.8"
unsafe-libopus = { version = "0.2", optional = true }
webrtc = "0.21"

[[example]]
name = "worker_live"
required-features = ["gui"]

[features]
default = ["gui"]
# Desktop app (egui) and H264 decoding; `--no-default-features` builds the CLI only.
gui = ["dep:openh264", "dep:cpal", "dep:unsafe-libopus", "dep:eframe", "dep:image", "dep:notify-rust", "dep:ksni", "dep:tray-icon", "dep:windows-sys", "dep:winreg"]

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"], optional = true }

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26", optional = true }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"], optional = true }
winreg = { version = "0.56", optional = true }

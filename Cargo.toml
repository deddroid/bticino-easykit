[package]
name = "bticino-easykit"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Unofficial Linux/Windows client for the BTicino EASYKIT WiFi video door entry kit (Netatmo cloud)"
license = "MIT"
repository = "https://github.com/deddroid/bticino-easykit"
readme = "README.md"
keywords = ["bticino", "netatmo", "intercom", "doorbell", "easykit"]
categories = ["command-line-utilities"]

[lib]
name = "bticino_easykit"
path = "src/lib.rs"

[[bin]]
name = "bticino-easykit"
path = "src/bin/cli.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
env_logger = "0.11"
fcm_receiver_rs = "0.1.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
rtc = { version = "0.21.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "0.8"
webrtc = "0.21"
